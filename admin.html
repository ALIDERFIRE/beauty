<!DOCTYPE html>
<html lang="es">
<head>

<style>
:root{--uva:#4a1772;--morado:#6d2aa0;--lila:#b98ddb;--pastel:#efe3f8;--fondo:#f6f3f9;--tinta:#231429;--gris:#746a7c;--linea:#e4dbec;--ok:#1f9d61;--wa:#25d366;--rojo:#c0392b;--ambar:#b7791f}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Poppins,system-ui,sans-serif;background:var(--fondo);color:var(--tinta);font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:0}
input,select,textarea{font:inherit;width:100%;padding:10px 12px;border:1.5px solid var(--linea);border-radius:10px;background:#fff;color:var(--tinta)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--morado)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--uva)}
label.c{display:block;font-size:12px;font-weight:600;color:var(--gris);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.oculto{display:none!important}
.script{font-family:'Great Vibes',cursive}
/* login */
#login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#2e0d49,var(--uva) 55%,#8a3fc0);padding:20px}
#login .c{background:#fff;border-radius:22px;padding:34px 28px;width:100%;max-width:360px;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.35)}
#login .script{font-size:44px;color:var(--uva);line-height:1}
#login p{color:var(--gris);margin:4px 0 20px}
/* layout */
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,#34105a,var(--uva));color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
aside .script{font-size:34px;text-align:center;line-height:1}
aside small{display:block;text-align:center;opacity:.7;margin-bottom:22px;letter-spacing:.2em;font-size:10px;text-transform:uppercase}
aside nav{display:flex;flex-direction:column;gap:4px;flex:1}
aside nav button{background:none;color:#e9dcf5;text-align:left;padding:11px 14px;border-radius:10px;font-size:14px;font-weight:500;display:flex;gap:10px;align-items:center;white-space:nowrap}
aside nav button:hover{background:rgba(255,255,255,.1)}
aside nav button.on{background:#fff;color:var(--uva)}
aside .pie{display:flex;flex-direction:column;gap:6px}
aside .pie a,aside .pie button{background:rgba(255,255,255,.12);color:#fff;padding:9px;border-radius:10px;text-align:center;text-decoration:none;font-size:13px}
main{padding:24px;min-width:0}
h1{font-size:22px;color:var(--uva)}
.cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:10px;background:var(--uva);color:#fff;font-weight:600;font-size:13.5px;text-decoration:none}
.btn:hover{background:var(--morado)}
.btn.g{background:#fff;color:var(--uva);border:1.5px solid var(--linea)}
.btn.wa{background:var(--wa)}.btn.r{background:#fff;color:var(--rojo);border:1.5px solid #ecc7c2}.btn.v{background:var(--ok)}
.btn.mini{padding:6px 10px;font-size:12px;border-radius:8px}
.btn[disabled]{opacity:.5;pointer-events:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:#fff;border-radius:14px;padding:16px;border:1px solid var(--linea)}
.kpi span{font-size:12px;color:var(--gris);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.kpi b{display:block;font-size:26px;color:var(--uva);line-height:1.2}
.panel{background:#fff;border-radius:14px;border:1px solid var(--linea);padding:18px;margin-bottom:18px}
.panel h2{font-size:16px;color:var(--uva);margin-bottom:12px}
.nav-f{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nav-f input{width:auto}
.turno{display:grid;grid-template-columns:76px 1fr;gap:14px;padding:14px;border:1px solid var(--linea);border-radius:12px;margin-bottom:10px;border-left:5px solid var(--ambar);background:#fff}
.turno.CONFIRMADO{border-left-color:var(--ok)}.turno.ATENDIDO{border-left-color:var(--uva)}.turno.CANCELADO,.turno.AUSENTE{border-left-color:var(--rojo);opacity:.65}
.turno .h{text-align:center}.turno .h b{font-size:21px;color:var(--uva);display:block;line-height:1.1}.turno .h small{color:var(--gris)}
.turno .n{font-weight:600;font-size:15px}
.turno .s{color:var(--gris);font-size:13px}
.acc{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.est{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:700;background:#fff3d6;color:#8a6200}
.est.CONFIRMADO{background:#e4f6ec;color:#17764a}.est.CANCELADO,.est.AUSENTE{background:#fbe4e1;color:#a5281b}.est.ATENDIDO{background:var(--pastel);color:var(--uva)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;background:#e8f0fe;color:#2456b8;font-weight:600}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--gris);padding:8px 10px;border-bottom:2px solid var(--linea)}
td{padding:10px;border-bottom:1px solid var(--linea);vertical-align:middle}
.vacio{text-align:center;color:var(--gris);padding:30px 10px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tres{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.hfila{display:grid;grid-template-columns:110px 1fr 1fr 60px;gap:10px;align-items:center;padding:6px 0}
/* modal */
.modal{position:fixed;inset:0;background:rgba(35,20,41,.55);z-index:80;display:grid;place-items:center;padding:16px}
.modal .m{background:#fff;border-radius:18px;padding:22px;width:100%;max-width:480px;max-height:92vh;overflow:auto}
.modal h2{color:var(--uva);font-size:18px;margin-bottom:6px}
.modal .pie{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.err{color:var(--rojo);font-size:13px;min-height:18px;margin-top:8px}
.chat{display:grid;grid-template-columns:290px minmax(0,1fr);gap:14px;height:calc(100vh - 130px);min-height:380px}
.hilos,.conv{background:#fff;border:1px solid var(--linea);border-radius:14px;overflow:auto}
.hilo{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;padding:12px 14px;border-bottom:1px solid var(--linea);color:var(--tinta)}
.hilo.on{background:var(--pastel)}.hilo span{min-width:0}.hilo small{display:block;color:var(--gris);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hilo i{font-style:normal;background:#e5484d;color:#fff;border-radius:99px;padding:0 7px;font-size:11px}
.conv{display:flex;flex-direction:column;overflow:hidden}
.conv-h{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--linea)}.conv-h small{display:block;color:var(--gris)}
#cVolver{display:none}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--fondo)}
.msg{max-width:78%;padding:8px 12px;border-radius:14px 14px 14px 4px;background:#fff;border:1px solid var(--linea);align-self:flex-start;white-space:pre-wrap;word-break:break-word}
.msg.yo{align-self:flex-end;background:var(--uva);color:#fff;border-color:var(--uva);border-radius:14px 14px 4px 14px}
.msg small{display:block;opacity:.65;font-size:10.5px;text-align:right}
.envio{display:flex;gap:8px;padding:10px;border-top:1px solid var(--linea)}
@media(max-width:820px){.chat{grid-template-columns:minmax(0,1fr);height:70vh}.chat .conv{display:none}.chat.viendo .hilos{display:none}.chat.viendo .conv{display:flex}#cVolver{display:inline-flex}}
#campN,#chatN{color:#fff;background:#e5484d;border-radius:99px;padding:1px 7px;font-size:11px;margin-left:4px}
.aviso-i{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--linea)}.aviso-i small{color:var(--gris);display:block}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:11px 20px;border-radius:99px;z-index:99;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#velo{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--lila),var(--uva));z-index:100;animation:v 1s linear infinite}
@keyframes v{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@media(max-width:820px){#app{grid-template-columns:minmax(0,1fr)}aside{position:static;height:auto;padding:12px;min-width:0}.nav-f input{flex:1;min-width:140px}aside small{margin-bottom:10px}aside nav{flex-direction:row;overflow-x:auto;padding-bottom:6px}aside .pie{flex-direction:row;margin-top:8px}aside .pie>*{flex:1}main{padding:16px}.dos,.tres{grid-template-columns:1fr}.turno{grid-template-columns:62px 1fr}.hfila{grid-template-columns:90px 1fr 1fr 40px}}
.sthumb{width:64px;height:48px;border-radius:8px;object-fit:cover;background:var(--pastel);display:grid;place-items:center;font-size:10px;color:var(--gris);text-align:center}
#sPrev{width:100%;max-height:170px;object-fit:cover;border-radius:10px;margin-top:8px}
.pvac{aspect-ratio:4/3;display:grid;place-items:center;font-size:44px;background:linear-gradient(135deg,var(--pastel),#dcc3f1)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.fcard{border:1px solid var(--linea);border-radius:14px;overflow:hidden;background:#fff}
.fcard img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--pastel)}
.fcard .fc{padding:10px;display:flex;flex-direction:column;gap:8px}
label.chk{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.fsube{display:grid;grid-template-columns:1.3fr 1fr;gap:12px;align-items:end}
@media(max-width:820px){.fsube{grid-template-columns:1fr}}
/* ---- encabezado, menú lateral claro y pie ---- */
#app{grid-template-columns:230px minmax(0,1fr);grid-template-rows:auto 1fr auto}
.top{grid-column:1/-1;position:sticky;top:0;z-index:40;background:linear-gradient(90deg,#2e0d49,var(--uva) 60%,#7a35b0);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 20px;box-shadow:0 4px 18px rgba(35,20,41,.25)}
.top .marca{display:flex;gap:12px;align-items:center;min-width:0}
.top img{width:44px;height:44px;border-radius:50%;background:#fff;object-fit:cover;flex:none}
.top .script{font-size:28px;line-height:1;display:block;white-space:nowrap}
.top small{font-size:10px;letter-spacing:.2em;text-transform:uppercase;opacity:.75}
.top-a{display:flex;gap:8px;align-items:center}
.top-a a,.top-a button{background:rgba(255,255,255,.15);color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;text-decoration:none;white-space:nowrap}
.top-a a:hover,.top-a button:hover{background:rgba(255,255,255,.28)}
#aFecha{font-size:13px;opacity:.85;margin-right:6px}#aFecha::first-letter{text-transform:uppercase}
aside{background:#fff;color:var(--tinta);border-right:1px solid var(--linea);padding:16px 12px;position:static;height:auto;display:block}
aside nav{position:sticky;top:82px}
aside nav button{color:var(--tinta)}aside nav button:hover{background:var(--pastel)}aside nav button.on{background:var(--uva);color:#fff}
.bot{grid-column:1/-1;background:#24093a;color:#d9c7e8;padding:14px 20px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px}
.bot b{color:#fff}
.chat{height:calc(100vh - 240px)}
@media(max-width:820px){#app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 1fr auto}.chat{height:65vh}.top{padding:8px 12px}.top .tx,#aFecha{display:none}.top .script{font-size:22px}.top img{width:36px;height:36px}.top-a a,.top-a button{padding:8px 10px}
aside{border-right:0;border-bottom:1px solid var(--linea);padding:8px}aside nav{position:static}.bot{justify-content:center;text-align:center}}
</style>
</head>
<body>

<div id="login"><div class="c">
  <div class="script" id="lNombre">Beauty Coiffure</div><p>Panel administrativo</p>
  <input type="password" id="lClave" placeholder="Clave de acceso" autocomplete="current-password">
  <button class="btn" id="lBtn" style="width:100%;margin-top:12px">Ingresar</button>
  <div class="err" id="lErr"></div>
</div></div>

<div id="app" class="oculto">
  <header class="top">
    <div class="marca"><img id="aLogo" src="/logo.png" alt=""><div><span class="script" id="aNombre">Beauty Coiffure</span><small>Panel administrativo</small></div></div>
    <div class="top-a"><span id="aFecha"></span><button id="campana">🔔 <span class="tx">Avisos</span> <b id="campN" class="oculto"></b></button><a id="verWeb" target="_blank" rel="noopener">🌐 <span class="tx">Ver web</span></a><button id="salir">Salir</button></div>
  </header>
  <aside>
    <nav id="menu">
      <button data-v="agenda" class="on">📅 Agenda</button>
      <button data-v="turnos">📋 Turnos</button>
      <button data-v="chat">💬 Chat <b id="chatN" class="oculto"></b></button>
      <button data-v="clientes">👥 Clientes</button>
      <button data-v="fotos">🖼️ Fotos</button>
      <button data-v="promos">📣 Promos</button>
      <button data-v="servicios">💇 Servicios</button>
      <button data-v="horarios">🕐 Horarios</button>
      <button data-v="config">⚙️ Configuración</button>
    </nav>
  </aside>
  <main id="vista"></main>
  <footer class="bot"><span>© <span id="aAnio"></span> <b id="aPieNombre">Beauty Coiffure</b> · Panel administrativo</span><span id="aPieDatos"></span></footer>
</div>

<div id="modal" class="modal oculto"><div class="m" id="modalC"></div></div>
<div id="toast" class="oculto"></div>
<div id="velo" class="oculto"></div>

<script>
var TOKEN = '', D = null, vista = 'agenda', dia = '', filtroT = { estado: '', q: '', cuando: 'prox' };
var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
var DIASN = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function gs(n) { return 'Gs. ' + Number(n || 0).toLocaleString('es-PY'); }
function fDate(f) { var p = f.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function iso(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function mas(f, n) { var d = fDate(f); d.setDate(d.getDate() + n); return iso(d); }
function fLarga(f) { var d = fDate(f); return DIASN[d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()]; }
function fCorta(f) { var p = f.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
function telWa(t) { t = String(t || '').replace(/\D/g, ''); if (t.charAt(0) === '0') t = '595' + t.slice(1); else if (t.length === 9 && t.charAt(0) === '9') t = '595' + t; return t; }
function waLink(tel, msg) { return 'https://wa.me/' + telWa(tel) + '?text=' + encodeURIComponent(msg); }
function toast(m, ms) { var t = $('toast'); t.textContent = m; t.classList.remove('oculto'); clearTimeout(t._t); t._t = setTimeout(function () { t.classList.add('oculto'); }, ms || 2800); }
function guardarToken(t) { TOKEN = t; try { if (t) sessionStorage.setItem('bc_tk', t); else sessionStorage.removeItem('bc_tk'); } catch (e) {} }

var enCurso = 0;
function api(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  enCurso++; $('velo').classList.remove('oculto');
  return new Promise(function (ok, mal) {
    var fin = function () { if (--enCurso <= 0) { enCurso = 0; $('velo').classList.add('oculto'); } };
    var r = google.script.run.withSuccessHandler(function (x) { fin(); ok(x); }).withFailureHandler(function (e) {
      fin(); var m = String(e && e.message || e).replace(/^Error:\s*/, '');
      if (m === 'SESION') { guardarToken(''); $('app').classList.add('oculto'); $('login').classList.remove('oculto'); m = 'La sesión venció. Ingresá de nuevo.'; $('lErr').textContent = m; }
      mal(new Error(m));
    });
    r[fn].apply(r, args);
  });
}

/* ---------- sesión ---------- */
function entrar() {
  var b = $('lBtn'); $('lErr').textContent = ''; b.disabled = true;
  api('adminLogin', $('lClave').value).then(function (t) { guardarToken(t); $('lClave').value = ''; return cargar(); })
    .catch(function (e) { $('lErr').textContent = e.message; }).then(function () { b.disabled = false; });
}
$('lBtn').onclick = entrar;
$('lClave').addEventListener('keydown', function (e) { if (e.key === 'Enter') entrar(); });
$('salir').onclick = function () { AVISOS = []; hiloAbierto = ''; sinLeer = 0; campana(); api('adminSalir', TOKEN).catch(function () {}); guardarToken(''); $('app').classList.add('oculto'); $('login').classList.remove('oculto'); };
try { var tk = sessionStorage.getItem('bc_tk'); if (tk) { TOKEN = tk; cargar().catch(function () {}); } } catch (e) {}

function cargar() {
  return api('adminDatos', TOKEN).then(function (d) {
    D = d; if (!dia) dia = d.hoy;
    // La primera vez que se entra desde Vercel se guarda la dirección pública (enlaces y push la usan)
    if (d.config.url_publica !== location.origin) { d.config.url_publica = location.origin; api('adminGuardarConfig', TOKEN, { url_publica: location.origin }).catch(function () {}); }
    D.url = location.origin; document.title = (d.config.nombre || 'Salón') + ' · Panel'; firma = firmar(d.turnos); chatBadge();
    if (!reloj) { reloj = setInterval(sondear, 45000); setInterval(chatTick, 8000); }
    $('aNombre').textContent = d.config.nombre || 'Salón'; $('lNombre').textContent = d.config.nombre || 'Salón';
    $('aPieNombre').textContent = d.config.nombre || 'Salón'; $('aAnio').textContent = d.hoy.slice(0, 4); $('aFecha').textContent = fLarga(d.hoy);
    $('aPieDatos').textContent = [d.config.direccion, d.config.ciudad, d.config.whatsapp ? 'WhatsApp +' + d.config.whatsapp : ''].filter(Boolean).join(' · ');
    if (/^https?:\/\//i.test(d.config.logo_url || '')) $('aLogo').src = d.config.logo_url;
    $('verWeb').href = '/';
    $('login').classList.add('oculto'); $('app').classList.remove('oculto'); pintar();
  });
}
$('menu').onclick = function (e) {
  var b = e.target.closest('[data-v]'); if (!b) return; vista = b.getAttribute('data-v');
  [].forEach.call($('menu').children, function (x) { x.classList.toggle('on', x === b); }); pintar();
};
function pintar() { ({ agenda: vAgenda, turnos: vTurnos, chat: vChat, clientes: vClientes, fotos: vFotos, promos: vPromos, servicios: vServicios, horarios: vHorarios, config: vConfig })[vista](); }
function turno(c) { return D.turnos.filter(function (t) { return t.codigo === c; })[0]; }
function orden(a, b) { return (a.fecha + a.hora).localeCompare(b.fecha + b.hora); }

/* ---------- avisos en vivo (turnos que llegan desde la web) ---------- */
var AVISOS = [], firma = {}, reloj = null, sinLeer = 0, sonido = true, audio = null;
try { sonido = localStorage.getItem('bc_son') !== '0'; } catch (e) {}
function firmar(l) { var m = {}; l.forEach(function (t) { m[t.codigo] = t.estado + '|' + t.fecha + '|' + t.hora; }); return m; }
function campana() { var n = $('campN'); n.textContent = sinLeer; n.classList.toggle('oculto', !sinLeer); }
function pitido() {
  if (!sonido) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    [880, 1175].forEach(function (hz, i) {
      var o = audio.createOscillator(), g = audio.createGain(), t0 = audio.currentTime + i * 0.18;
      o.frequency.value = hz; o.connect(g); g.connect(audio.destination);
      g.gain.setValueAtTime(0.25, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.3);
      o.start(t0); o.stop(t0 + 0.32);
    });
  } catch (e) {}

// Achica la foto en el navegador (máx. 1600 px, JPG) antes de enviarla: sube rápido aunque venga de la cámara
function reducir(file) {
  return new Promise(function (ok, mal) {
    var img = new Image(), u = URL.createObjectURL(file);
    img.onload = function () {
      var k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      ok(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = function () { URL.revokeObjectURL(u); mal(new Error('No se pudo leer "' + file.name + '". Usá JPG o PNG.')); };
    img.src = u;
  });
}

  function secreto() { return { push_secret: $('vista').querySelector('[data-k=push_secret]').value.trim() }; }
  $('pAct').onclick = function () {
    PUSH.suscribir().then(function (s) { return api('adminGuardarConfig', TOKEN, secreto()).then(function () { return api('adminPushSuscribir', TOKEN, s); }); })
      .then(function () { toast('Notificaciones activadas en este dispositivo ✓', 5000); }).catch(function (e) { toast(e.message, 8000); });
  };
  $('pPrueba').onclick = function () {
    api('adminGuardarConfig', TOKEN, secreto()).then(function () { return api('adminPushProbar', TOKEN); })
      .then(function (n) { toast('Prueba enviada a ' + n + ' dispositivo(s)', 5000); }).catch(function (e) { toast(e.message, 8000); });
  };
  $('cClaveOk').onclick = function () {
    api('adminGuardarConfig', TOKEN, { admin_clave: $('cClave').value }).then(function () { toast('Clave cambiada'); $('cClave').value = ''; }).catch(function (e) { toast(e.message); });
  };
}

/* ---------- MODAL TURNO (nuevo / editar / reajustar) ---------- */
function abrir(html) { $('modalC').innerHTML = html; $('modal').classList.remove('oculto'); }
function cerrar() { $('modal').classList.add('oculto'); $('modalC').innerHTML = ''; $('modalC').onclick = null; }
$('modal').addEventListener('click', function (e) { if (e.target === this || e.target.hasAttribute('data-cerrar')) cerrar(); });

function mTurno(t, soloMover, pre) {
  var n = !t; t = t || { codigo: '', cliente: (pre && pre.cliente) || '', telefono: (pre && pre.telefono) || '', servicio_id: '', fecha: dia || D.hoy, hora: '', notas: '', estado: 'CONFIRMADO' };
  var orig = { fecha: t.fecha, hora: t.hora }, ro = soloMover ? ' disabled' : '';
  var servs = D.servicios.filter(function (s) { return s.activo || s.id === t.servicio_id; });
  abrir('<h2>' + (n ? 'Nuevo turno' : soloMover ? 'Reajustar turno' : 'Editar turno') + '</h2>' +
    (soloMover ? '<p style="color:var(--gris)">' + esc(t.cliente) + ' · ' + esc(t.servicio) + '<br>Actual: ' + esc(fLarga(t.fecha)) + ' ' + esc(t.hora) + ' hs</p>' : '') +
    '<div' + (soloMover ? ' class="oculto"' : '') + '><label class="c">Cliente</label><input id="mN" value="' + esc(t.cliente) + '" maxlength="60"' + ro + '>' +
    '<label class="c">WhatsApp</label><input id="mT" value="' + esc(t.telefono) + '" inputmode="tel" maxlength="20" placeholder="0981 123 456"' + ro + '>' +
    '<label class="c">Servicio</label><select id="mS"><option value="">Elegir…</option>' + servs.map(function (s) { return '<option value="' + esc(s.id) + '"' + (s.id === t.servicio_id ? ' selected' : '') + '>' + esc(s.nombre) + ' (' + s.duracion + ' min · ' + gs(s.precio) + ')</option>'; }).join('') + '</select></div>' +
    '<div class="dos"><div><label class="c">Fecha</label><input type="date" id="mF" value="' + esc(t.fecha) + '"></div><div><label class="c">Hora</label><select id="mH"><option value="">—</option></select></div></div>' +
    '<div' + (soloMover ? ' class="oculto"' : '') + '><label class="c">Estado</label><select id="mE">' + D.estados.map(function (e) { return '<option' + (e === t.estado ? ' selected' : '') + '>' + e + '</option>'; }).join('') + '</select>' +
    '<label class="c">Notas</label><textarea id="mO" rows="2" maxlength="200">' + esc(t.notas) + '</textarea></div>' +
    '<label style="display:flex;gap:8px;align-items:center;margin-top:14px"><input type="checkbox" id="mW"' + (soloMover || n ? ' checked' : '') + '> Avisar al cliente por WhatsApp al guardar</label>' +
    '<div class="err" id="mErr"></div><div class="pie"><button class="btn g" data-cerrar>Cerrar</button><button class="btn" id="mOk">Guardar</button></div>');

  function horas() {
    var f = $('mF').value, s = $('mS').value, sel = $('mH'), marca = sel._m = Date.now();
    if (!f || !s) { sel.innerHTML = '<option value="">Elegí servicio y fecha</option>'; return; }
    sel.innerHTML = '<option value="">Cargando…</option>';
    api('adminHorarios', TOKEN, f, s, t.codigo).then(function (r) {
      if (sel._m !== marca) return;
      var l = r.slots.slice();
      if (f === orig.fecha && orig.hora && l.indexOf(orig.hora) < 0) { l.push(orig.hora); l.sort(); }
      sel.innerHTML = l.length ? '<option value="">Elegir hora…</option>' + l.map(function (h) { return '<option' + (f === orig.fecha && h === orig.hora ? ' selected' : '') + '>' + h + '</option>'; }).join('') : '<option value="">' + esc(r.motivo || 'Sin horarios') + '</option>';
    }).catch(function (e) { if (sel._m === marca) sel.innerHTML = '<option value="">' + esc(e.message) + '</option>'; });
  }
  $('mF').onchange = horas; $('mS').onchange = horas; horas();

  $('mOk').onclick = function () {
    var b = this, d = { codigo: t.codigo, cliente: $('mN').value, telefono: $('mT').value, servicio_id: $('mS').value, fecha: $('mF').value, hora: $('mH').value, notas: $('mO').value, estado: $('mE').value };
    if (!d.hora) return $('mErr').textContent = 'Elegí la hora.';
    var movio = !n && (d.fecha !== orig.fecha || d.hora !== orig.hora), avisar = $('mW').checked;
    if (soloMover && !movio) return $('mErr').textContent = 'Elegí una fecha u hora distinta.';
    if (soloMover) d.estado = 'CONFIRMADO';
    b.disabled = true;
    var w = avisar && d.telefono ? window.open('about:blank', '_blank') : null;
    api('adminGuardarTurno', TOKEN, d).then(function (r) {
      if (w) w.location.href = waLink(r.telefono, msj(n ? 'confirmar' : movio ? 'reajuste' : 'recordar', r));
      cerrar(); toast(n ? 'Turno creado' : movio ? 'Turno reajustado' : 'Turno guardado'); dia = r.fecha; return cargar();
    }).catch(function (e) { if (w) w.close(); $('mErr').textContent = e.message; b.disabled = false; });
  };
}
